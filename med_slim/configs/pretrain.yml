feat_dataset:
  # Directory structure (with spatial_modes): {feat_dir}/{spatial_mode}/{model}/{split}/{plane}/*.safetensors
  # Directory structure (without spatial_modes): {feat_dir}/{model}/{split}/{plane}/*.safetensors
  datasets:
    # Semi-supervised contrastive learning (SemiSupCon):
    # Uncomment to use SupCon loss for labeled MRNet samples alongside InfoNCE.
    # Labeled samples get additional same-class positives; unlabeled samples use standard InfoNCE.
    - name: mrnet
      feat_dir: "/hpcwork/rwth1833/feat_caches/MRNet/slices_raw/crop"
      # annotations_path: "/hpcwork/rwth1833/datasets/preprocessed/MRNet/train.csv"
      # target_columns: ["abnormal", "acl", "meniscus"]
    # Unlabeled (pure InfoNCE)
    # - name: fastMRI
    #   feat_dir: "/hpcwork/rwth1833/feat_caches/fastMRI/slices_raw/adaptive"
    # - name: kmar-50k
    #   feat_dir: "/hpcwork/rwth1833/feat_caches/KMAR-50K/slices_raw/adaptive"
  model_name: 
    - "dinov2"
    - "rad-dino"
    - "dinov3"
    - "medsiglip"
    - "biomedclip"
    - "ark"
    # - "mri-core"
  plane: # "axial", "sagittal", "coronal"
    - "sagittal"
    - "coronal"
    - "axial"
  num_target_slices: 32

model:
  slice_encoder_models:
    - name: dinov2
      img_size: [224, 224]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1024
      repo: "facebook/dinov2-large"
    - name: dinov3
      img_size: [224, 224]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1536
      repo: "facebook/dinov3-convnext-large-pretrain-lvd1689m"
    - name: rad-dino
      img_size: [518, 518]
      image_mean: [0.5307, 0.5307, 0.5307]
      image_std: [0.2583, 0.2583, 0.2583]
      embed_dim: 768
      repo: "microsoft/rad-dino"
    - name: medsiglip
      img_size: [448, 448]
      image_mean: [0.5, 0.5, 0.5]
      image_std: [0.5, 0.5, 0.5]
      embed_dim: 1152
      repo: "google/medsiglip-448"
    - name: biomedclip
      img_size: [224, 224]
      image_mean: [0.48145466, 0.4578275, 0.40821073]
      image_std: [0.26862954, 0.26130258, 0.27577711]
      embed_dim: 512
      repo: "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"
    - name: ark
      img_size: [768, 768]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1376
      repo: "/hpcwork/rwth1833/models/ark/Ark+_Nature/Ark6_swinLarge768_ep50.pth.tar"
    - name: mri-core
      img_size: [224, 224]
      image_mean: [0.0, 0.0, 0.0]  # MRI-CORE uses per-slice min-max normalization internally
      image_std: [1.0, 1.0, 1.0]
      embed_dim: 768
      repo: "/hpcwork/rwth1833/models/mri_core/mri_foundation.pth"
    - name: medimageinsight
      img_size: [480, 480]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1024
      repo: "/hpcwork/rwth1833/models/MedImageInsights"
    - name: curia
      img_size: [512, 512]
      image_mean: [0.0, 0.0, 0.0]  # Curia applies per-slice z-score normalization internally
      image_std: [1.0, 1.0, 1.0]
      embed_dim: 768
      repo: "raidium/curia"

  cobra:
    embed_dim: 1536 # 768, 1024, 1536
    contrast_dim: 256
    input_dims: [768, 1024, 1536, 1152, 512, 1376]
    num_heads: 8
    num_layers: 12 # 2, 6, 12
    dropout: 0.2
    # Mamba2-specific
    mamba_d_state: 128
    # Transformer-specific
    transformer_rotary_positional_encoding: "RoPE"  # "RoPE" or "LiRE" 
    transformer_norm_first: true  # Pre-LN transformer
    # Pooling-specific (ABMIL / cross_attention)
    attn_dim: 256
    # Physical positional encoding: sinusoidal encoding keyed on slice
    # positions in mm. Essential for cross-domain pretraining where
    # slice spacings vary across anatomies and protocols.
    physical_pe: false

train:
  momentum: 0.99
  temperature: 0.2
  batch_size: 512
  num_epochs: 3000
  learning_rate: 2e-4 #5e-4 
  warmup_epochs: 100 #50
  weight_decay: 0.1
  num_workers: 20
  early_stopping: 
    patience: 10
  save_ckpt_path: "/hpcwork/qj474765/checkpoints/MedSliM-pretraining/MRNet" #"MRNet-fastMRI-KMAR50K"

# Masked Slice Prediction (MSP): JEPA-style auxiliary objective.
# Predicts teacher encoder hidden states for contiguously masked slices.
# Combined with InfoNCE: L = L_InfoNCE + lambda_mask * L_MSP + lambda_ctx * L_ctx
# Set enabled: false to fall back to pure InfoNCE (default MedSliM behavior).
msp:
  enabled: false
  lambda_mask: 1.0        # Weight for MSP loss on masked positions
  lambda_ctx: 0.0         # Base weight λ for context loss on visible positions (V-JEPA 2.1); 0 = disabled
  mask_ratio: [0.3, 0.5]  # [min_ratio, max_ratio] for contiguous masking
  predictor_depth: 2      # Number of residual MLP blocks in the MSP predictor
  predictor_dim: null      # Hidden dim of predictor (null = embed_dim // 4)
  max_seq_len: 512        # Max sequence length for positional embeddings
  ctx_distance_weighted: true  # Per-token weight λ_i = λ / sqrt(d_min); false = uniform weight
  ctx_warmup_epochs: null      # [start, end] epoch range for linear warmup of lambda_ctx; 
                               # null = no warmup
                               # Example: ctx_warmup_epochs: [50, 150] linearly ramps lambda_ctx from 0 to lambda_ctx over epochs 50–150

