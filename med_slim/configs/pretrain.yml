feat_dataset:
  # Directory structure (with spatial_modes): {feat_dir}/{spatial_mode}/{model}/{split}/{plane}/*.safetensors
  # Directory structure (without spatial_modes): {feat_dir}/{model}/{split}/{plane}/*.safetensors
  datasets:
    # Semi-supervised contrastive learning (SemiSupCon):
    # Uncomment to use SupCon loss for labeled MRNet samples alongside InfoNCE.
    # Labeled samples get additional same-class positives; unlabeled samples use standard InfoNCE.
    - name: mrnet
      feat_dir: "/hpcwork/rwth1833/feat_caches/MRNet/slices_raw/crop"
      # annotations_path: "/hpcwork/rwth1833/datasets/preprocessed/MRNet/train.csv"
      # target_columns: ["abnormal", "acl", "meniscus"]
    # Unlabeled (pure InfoNCE)
    - name: fastMRI
      feat_dir: "/hpcwork/rwth1833/feat_caches/fastMRI/slices_raw/adaptive"
    - name: kmar-50k
      feat_dir: "/hpcwork/rwth1833/feat_caches/KMAR-50K/slices_raw/adaptive"
  model_name:
    - "dinov2"
    - "dinov3"
    - "rad-dino"
    - "medsiglip"
    - "biomedclip"
    - "ark"
    - "mri-core"
    - "medimageinsight"
    - "curia"
  plane: # "axial", "sagittal", "coronal"
    - "sagittal"
    - "coronal"
    - "axial"
  num_target_slices: 32

model:
  slice_encoder_models:
    - name: dinov2
      img_size: [224, 224]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1024
      repo: "facebook/dinov2-large"
    - name: dinov3
      img_size: [224, 224]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1536
      repo: "facebook/dinov3-convnext-large-pretrain-lvd1689m"
    - name: rad-dino
      img_size: [518, 518]
      image_mean: [0.5307, 0.5307, 0.5307]
      image_std: [0.2583, 0.2583, 0.2583]
      embed_dim: 768
      repo: "microsoft/rad-dino"
    - name: medsiglip
      img_size: [448, 448]
      image_mean: [0.5, 0.5, 0.5]
      image_std: [0.5, 0.5, 0.5]
      embed_dim: 1152
      repo: "google/medsiglip-448"
    - name: biomedclip
      img_size: [224, 224]
      image_mean: [0.48145466, 0.4578275, 0.40821073]
      image_std: [0.26862954, 0.26130258, 0.27577711]
      embed_dim: 512
      repo: "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"
    - name: ark
      img_size: [768, 768]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1376
      repo: "/hpcwork/rwth1833/models/Ark6_swinLarge768_ep50.pth.tar"
    - name: mri-core
      img_size: [224, 224]
      image_mean: [0.0, 0.0, 0.0]  # MRI-CORE uses per-slice min-max normalization internally
      image_std: [1.0, 1.0, 1.0]
      embed_dim: 768
      repo: "/hpcwork/rwth1833/models/mri_foundation.pth"
    - name: medimageinsight
      img_size: [480, 480]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1024
      repo: "/hpcwork/rwth1833/models/MedImageInsights"
    - name: curia
      img_size: [512, 512]
      image_mean: [0.0, 0.0, 0.0]  # Curia applies per-slice z-score normalization internally
      image_std: [1.0, 1.0, 1.0]
      embed_dim: 768
      repo: "raidium/curia"

  cobra:
    embed_dim: 1024 # 768, 1024, 1536
    contrast_dim: 256
    input_dims: [768, 1024, 1536, 1152, 512, 1376]
    num_heads: 8
    num_layers: 2 # 2, 6, 12
    dropout: 0.2
    # Mamba2-specific
    mamba_d_state: 128
    # Transformer-specific
    transformer_rotary_positional_encoding: "RoPE"  # "RoPE" or "LiRE" 
    transformer_norm_first: true  # Pre-LN transformer
    # Pooling-specific (ABMIL / cross_attention)
    attn_dim: 256
    # Physical positional encoding: sinusoidal encoding keyed on normalized
    # relative slice depth in [0, 1] (fraction through the volume).
    # Spacing-independent and portable across mixed cohorts/protocols.
    physical_pe: false
    # Flattened regional-token pretraining.
    # 0 = global CLS only. A positive perfect square (e.g. 4 for 2x2 tiles)
    # expects feature caches with 1 global + regional_tokens per-slice CLS tokens
    # and flattens [B, D, 1+regional_tokens, E] to [B, D*(1+regional_tokens), E].
    # This does not use MSP or WithinSliceAggregator.
    regional_tokens: 0
    # FM fusion: how to combine foundation-model embeddings per slice.
    fm_pooling: router          # avg_pool | router
    # Projection-adapter keying for the FM-set paths (subset SSL / FM-set inference).
    # per_dim: share one Embed MLP across FMs of the same input dim (legacy router/paired/packed SSL default).
    # per_fm_id: one Embed MLP per FM so each FM is a distinct expert (recommended for router).
    per_fm_adapter_mode: per_fm_id   # per_dim | per_fm_id
    router_use_fm_embedding: true
    router_use_fm_logit_bias: true
    router_use_fm_logit_scale: false
    router_mode: soft           # soft | topk
    router_top_k: null
    router_temperature: 0.7      # softmax temperature (lower = sharper routing)
    router_learnable_temperature: false  # keep false to avoid unchecked logit-scale drift

# FM subset SSL: positive-pair construction across foundation models.
ssl:
  fm_mode: subset                 # pair | subset
  fm_subset_size: 4
  fm_subset_min_overlap: 0       # disjoint FM subsets for stronger cross-FM augmentation
  fm_subset_max_overlap: 0

# Router auxiliary losses (only active when model.cobra.fm_pooling == router).
router:
  load_balance_weight: 0.001 
  z_loss_weight: 0.0
  confidence_weight: 0.0
  log_per_fm_usage: true

train:
  momentum: 0.99
  temperature: 0.2
  batch_size: 512 #256
  num_epochs: 2000
  learning_rate: 5e-4 #5e-4 
  warmup_epochs: 100 #50
  weight_decay: 0.1
  num_workers: 20
  early_stopping: 
    patience: 10
  save_ckpt_path: "/hpcwork/qj474765/checkpoints/MedSliM-pretraining/MRNet-fastMRI-KMAR50K" #"MRNet"

