feat_dataset:
  datasets:
    - name: mrnet
      feat_dir: "/hpcwork/rwth1833/feat_caches/MRNet/slices_32"
  model_name: 
    - "dinov2"
    - "rad-dino"
    - "dinov3"
    - "medsiglip"
    - "biomedclip"
    - "ark"
  plane: # "axial", "sagittal", "coronal"
    - "sagittal"
    - "coronal"
    - "axial"

model:
  slice_encoder_models:
    - name: dinov2
      img_size: [224, 224]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1024
      repo: "facebook/dinov2-large"
    - name: dinov3
      img_size: [224, 224]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1536
      repo: "facebook/dinov3-convnext-large-pretrain-lvd1689m"
    - name: rad-dino
      img_size: [518, 518]
      image_mean: [0.5307, 0.5307, 0.5307]
      image_std: [0.2583, 0.2583, 0.2583]
      embed_dim: 768
      repo: "microsoft/rad-dino"
    - name: medsiglip
      img_size: [448, 448]
      image_mean: [0.5, 0.5, 0.5]
      image_std: [0.5, 0.5, 0.5]
      embed_dim: 1152
      repo: "google/medsiglip-448"
    - name: biomedclip
      img_size: [224, 224]
      image_mean: [0.48145466, 0.4578275, 0.40821073]
      image_std: [0.26862954, 0.26130258, 0.27577711]
      embed_dim: 512
      repo: "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"
    - name: ark
      img_size: [768, 768]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1376
      repo: "/work/rwth1833/models/ark/Ark+_Nature/Ark6_swinLarge768_ep50.pth.tar"

  cobra:
    embed_dim: 1536 # 768, 1024, 1536
    contrast_dim: 1024
    input_dims: [768, 1024, 1536, 1152, 512, 1376]
    num_heads: 8
    num_mamba_layers: 20 # 2, 6, 20
    mamba_d_state: 128
    dropout: 0.2
    attn_dim: 1024

train:
  momentum: 0.99
  temperature: 0.2
  batch_size: 256
  num_epochs: 2000
  learning_rate: 3e-4
  warmup_epochs: 50
  weight_decay: 0.1
  num_workers: 4
  early_stopping: 
    patience: 10
  save_ckpt_path: "/hpcwork/qj474765/checkpoints/MedSliM-pretraining/test-run-MRNet"

