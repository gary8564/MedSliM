feat_dataset:
  datasets:
    - name: mrnet
      feat_dir: "/hpcwork/rwth1833/feat_caches/MRNet"
  model_name: 
    - "dinov2"
    - "rad-dino"
    - "medsiglip"
    - "biomedclip"
    - "ark"
  plane: # "axial", "sagittal", "coronal"
    - "sagittal"

model:
  slice_encoder_models:
    - name: dinov2
      img_size: [224, 224]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1024
      hf_repo: "facebook/dinov2-base"
    - name: rad-dino
      img_size: [518, 518]
      image_mean: [0.5307, 0.5307, 0.5307]
      image_std: [0.2583, 0.2583, 0.2583]
      embed_dim: 768
      hf_repo: "microsoft/rad-dino"
    - name: medsiglip
      img_size: [448, 448]
      image_mean: [0.5, 0.5, 0.5]
      image_std: [0.5, 0.5, 0.5]
      embed_dim: 1152
      hf_repo: "google/medsiglip-448"
    - name: biomedclip
      img_size: [224, 224]
      image_mean: [0.48145466, 0.4578275, 0.40821073]
      image_std: [0.26862954, 0.26130258, 0.27577711]
      embed_dim: 512
      hf_repo: "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"
    - name: ark
      img_size: [768, 768]
      image_mean: [0.485, 0.456, 0.406]
      image_std: [0.229, 0.224, 0.225]
      embed_dim: 1376

  cobra:
    embed_dim: 768
    contrast_dim: 512
    input_dims: [512, 768, 1024, 1152, 1376]
    num_heads: 8
    num_mamba_layers: 2
    mamba_d_state: 128
    dropout: 0.25
    attn_dim: 256
    

pretrain:
  momentum: 0.99
  temperature: 0.2
  batch_size: 128
  num_epochs: 500
  learning_rate: 5e-4
  warmup_epochs: 50
  weight_decay: 0.1
  num_workers: 8
  early_stopping: 
    patience: 10
  save_ckpt_path: "/hpcwork/qj474765/checkpoints/MedSliM-pretraining/test-run-MRNet"

