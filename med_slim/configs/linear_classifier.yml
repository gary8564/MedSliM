# ==============================================================================
# Linear Probing Evaluation Configuration
# ==============================================================================
# This config file defines the evaluation setup for linear probing of a pretrained
# MedSliM SSL model.  It specifies the model checkpoint, feature dataset, and
# evaluation hyperparameters.


# ------------------------------------------------------------------------------
# Model checkpoint configuration
# ------------------------------------------------------------------------------
# Path to pretrained MedSliM checkpoint
checkpoint_path: "/hpcwork/rwth1833/checkpoints/MedSliM-pretraining/MRNet/2026-02-07-14:10/medslim-epoch2000.pth.tar"
# checkpoint_path: "/hpcwork/qj474765/checkpoints/MedSliM-pretraining/CT-RATE/2026-07-05-04:15/medslim-epoch2000.pth.tar"
# Optional: path to the MedSliM pretraining config.yaml. If omitted, it is
# inferred as checkpoint_path's parent directory / "config.yaml" (the default
# layout written by train.py). checkpoint_path is always required
# Override with --pretrain-config-path if the checkpoint lives outside its original run directory.
# pretrain_config_path: "/path/to/pretrain/config.yaml"
encoder_type: "momentum"  # "base" or "momentum" encoder for downstream tasks
freeze_cobra: true  # true = linear probing (frozen COBRA), false = fine-tuning (trainable COBRA)
# trainable_layers: [attn]  # same names as --trainable-layers (CLI wins when present)

# ------------------------------------------------------------------------------
# Feature dataset configuration
# ------------------------------------------------------------------------------
# Feature cache directory structure:
#   {feat_dir}/{model_name}/{split}/{plane}/*.safetensors
# 
# Example for single-sequence (e.g. MRNet or kneeMRI):
#   feat_dataset:
#     dataset_name: "MRNet"
#     feat_dir: "/path/to/feat_caches/MRNet/slices_raw/crop"
#     plane: ["sagittal", "coronal", "axial"]   # multi-view channels
#     model_name: ["mri-core"]
#
# Example for multi-sequence ensembling (SKM-TEA DESS_E1 + DESS_E2 → logistic ensemble):
#   feat_dataset:
#     dataset_name: "SKM-TEA"
#     sequences:
#       DESS_E1: "/path/to/feat_caches/SKM-TEA/DESS_E1/slices_raw/adaptive"
#       DESS_E2: "/path/to/feat_caches/SKM-TEA/DESS_E2/slices_raw/adaptive"
#     plane: ["sagittal"]
#     model_name: ["dinov2"]

feat_dataset:
  dataset_name: "SKM-TEA"
  # feat_dir: "/hpcwork/rwth1833/feat_caches/kneeMRI/slices_raw/crop"
  plane:
    - "sagittal"
    # - "coronal"
    # - "axial"
  sequences: 
    DESS_E1: "/hpcwork/rwth1833/feat_caches/SKM-TEA/DESS_E1/slices_raw/adaptive"
    # DESS_E2: "/hpcwork/rwth1833/feat_caches/SKM-TEA/DESS_E2/slices_raw/adaptive" 
  model_name:
    - "mri-core"

