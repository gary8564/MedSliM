# ==============================================================================
# Linear Probing Evaluation Configuration
# ==============================================================================
# This config file defines the evaluation setup for linear probing of a pretrained
# MedSliM SSL model.  It specifies the model checkpoint, feature dataset, and
# evaluation hyperparameters.


# ------------------------------------------------------------------------------
# Model checkpoint configuration
# ------------------------------------------------------------------------------
# Path to pretrained MedSliM checkpoint
checkpoint_path: "/hpcwork/qj474765/checkpoints/MedSliM-pretraining/MRNet/2026-05-26-17:29/medslim-epoch3000.pth.tar"
# Optional; otherwise inferred as config.yaml next to checkpoint_path.
# pretrain_config_path: "/path/to/pretrain/config.yaml"
encoder_type: "momentum"  # "base" or "momentum" encoder for downstream tasks
freeze_cobra: true  # true = linear probing (frozen COBRA), false = fine-tuning (trainable COBRA)

# ------------------------------------------------------------------------------
# Feature dataset configuration
# ------------------------------------------------------------------------------
# Feature cache directory structure:
#   {feat_dir}/{model_name}/{split}/{plane}/*.safetensors
# 
# Example for single-sequence (e.g. MRNet or kneeMRI):
#   feat_dataset:
#     dataset_name: "MRNet"
#     feat_dir: "/path/to/feat_caches/MRNet/slices_raw/crop"
#     plane: ["sagittal", "coronal", "axial"]   # multi-view channels
#     model_name: ["mri-core"]
#
# Example for multi-sequence ensembling (e.g. SKM-TEA with DESS_E1 and DESS_E2):
#   feat_dataset:
#     dataset_name: "SKM-TEA"
#     sequences: # map each MRI sequence to its own feat_dir
#       DESS_E1: "/path/to/feat_caches/SKM-TEA/DESS_E1/slices_raw/adaptive"
#       DESS_E2: "/path/to/feat_caches/SKM-TEA/DESS_E2/slices_raw/adaptive"
#     plane: ["sagittal"]
#     model_name: ["dinov2"]

feat_dataset:
  dataset_name: "kneeMRI"
  feat_dir: "/hpcwork/rwth1833/feat_caches/kneeMRI/slices_raw/crop"
  plane:
    - "sagittal"
    # - "coronal"
    # - "axial"
  # sequences: 
    # DESS_E1: "/hpcwork/rwth1833/feat_caches/SKM-TEA/DESS_E1/slices_raw/adaptive"
    # DESS_E2: "/hpcwork/rwth1833/feat_caches/SKM-TEA/DESS_E2/slices_raw/adaptive"
  model_name:
    - "mri-core"

annotations_dir: "/hpcwork/rwth1833/datasets/preprocessed/kneeMRI"

# ------------------------------------------------------------------------------
# Output directory configuration
# ------------------------------------------------------------------------------
output_dir: "/hpcwork/qj474765/experiments/MedSliM-linear-probing"

# ------------------------------------------------------------------------------
# Hyperparameters
# ------------------------------------------------------------------------------
# Note: For fine-tuning, use lower learning rate and enable early stopping
hyperparams:
  batch_size: 8
  base_lr: 1e-5 # Base learning rate for linear heads
  backbone_lr_scale: 0.1 # COBRA backbone learning rate = base_lr * backbone_lr_scale when fine-tuning COBRA
  weight_decay: 0.1 #0.01  # L2 regularization to prevent overfitting
  warmup_ratio: 0.1  
  max_epochs: 100
  num_workers: 4
  val_split_ratio: 0.1
  patience: 10  # Early stopping: stop if val_auroc doesn't improve for num_patience epochs
  
  # Linear classifier hyperparameters
  linear:
    hidden_dim: 512 
    dropout: 0.5
  
  # Multi-view attention aggregator hyperparameters
  attention:
    hidden_dim: 512
    dropout: 0.25
