# Path to pretrained MedSliM checkpoint
checkpoint_path: "/hpcwork/rwth1833/checkpoints/MedSliM-pretraining/MRNet-KMAR/2026-02-07-22:06/medslim-epoch2000.pth.tar"
encoder_type: "momentum"  # "base" or "momentum" encoder for downstream tasks
freeze_cobra: true  # true = linear probing (frozen COBRA), false = fine-tuning (trainable COBRA)

feat_dataset:
  dataset_name: "MRNet"
  feat_dir: "/hpcwork/rwth1833/feat_caches/MRNet/slices_raw/crop"
  plane:
    - "sagittal"
    # - "coronal"
    # - "axial"
  model_name:
    - "dinov2"
    - "medsiglip"
    - "ark"
    - "mri-core"

train_annots: "/hpcwork/rwth1833/datasets/preprocessed/MRNet/train.csv"
# val_annots: "/path/to/val.csv"  # Optional: if provided, uses dedicated val set instead of splitting train
test_annots: "/hpcwork/rwth1833/datasets/preprocessed/MRNet/test.csv"
output_dir: "/hpcwork/rwth1833/experiments/MedSliM-linear-probing"

# Classification task settings
task: "binary" # "binary", "multiclass", "multilabel"
target_labels:
  - "meniscus" # "acl", "meniscus"

# Optional: class names for multiclass confusion matrix and per-class ROC plots.
# Required for multiclass; if omitted, auto-generates as ["class_0", "class_1", ...].
# class_names:
#   - "normal"
#   - "partial_injury"
#   - "complete_fracture"

# Hyperparameters
# Note: For fine-tuning, use lower learning rate and enable early stopping
hyperparams:
  batch_size: 1
  base_lr: 1e-5 # Base learning rate for linear heads (and optionally for fm_attn)
  backbone_lr_scale: 0.1 # COBRA backbone learning rate = base_lr * backbone_lr_scale when fine-tuning COBRA
  weight_decay: 0.01  # L2 regularization to prevent overfitting
  warmup_ratio: 0.1  
  max_epochs: 100
  num_workers: 4
  val_split_ratio: 0.1
  patience: 20  # Early stopping: stop if val_auroc doesn't improve for 10 epochs
  
  # Linear classifier hyperparameters
  linear:
    hidden_dim: 512 
    dropout: 0.5
  
  # Multi-view attention aggregator hyperparameters
  attention:
    hidden_dim: 512
    dropout: 0.1
