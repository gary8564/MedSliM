# Path to pretrained MedSliM checkpoint
checkpoint_path: "/hpcwork/rwth1833/checkpoints/MedSliM-pretraining/MRNet-fastMRI-KMAR50K/2026-02-16-11:36/medslim-epoch2000.pth.tar"
encoder_type: "momentum"  # "base" or "momentum" encoder for downstream tasks
freeze_cobra: true  # true = linear probing (frozen COBRA), false = fine-tuning (trainable COBRA)

feat_dataset:
  dataset_name: "kneeMRI" # "MRNet"
  feat_dir: "/hpcwork/rwth1833/feat_caches/kneeMRI/slices_raw/crop"
  plane:
    - "sagittal"
    # - "coronal"
    # - "axial"
  model_name:
    - "dinov2"
    - "medsiglip"
    - "ark"
    - "mri-core"

annotations_dir: "/hpcwork/rwth1833/datasets/preprocessed/kneeMRI"
output_dir: "/hpcwork/rwth1833/experiments/MedSliM-linear-probing"

# Hyperparameters
# Note: For fine-tuning, use lower learning rate and enable early stopping
hyperparams:
  batch_size: 1
  base_lr: 1e-5 # Base learning rate for linear heads (and optionally for fm_attn)
  backbone_lr_scale: 0.1 # COBRA backbone learning rate = base_lr * backbone_lr_scale when fine-tuning COBRA
  weight_decay: 0.01  # L2 regularization to prevent overfitting
  warmup_ratio: 0.1  
  max_epochs: 100
  num_workers: 4
  val_split_ratio: 0.1
  patience: 20  # Early stopping: stop if val_auroc doesn't improve for 10 epochs
  
  # Linear classifier hyperparameters
  linear:
    hidden_dim: 512 
    dropout: 0.5
  
  # Multi-view attention aggregator hyperparameters
  attention:
    hidden_dim: 512
    dropout: 0.1
