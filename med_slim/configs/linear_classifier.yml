# Linear Probing / Fine-tuning Evaluation Configuration
#
# Paths below use placeholders. Replace with your actual paths before running.

# Model checkpoint
checkpoint_path: "/path/to/checkpoints/MedSliM-pretraining/medslim-epoch2000.pth.tar"
encoder_type: "momentum"   # "base" or "momentum" encoder for downstream tasks
freeze_cobra: true          # true = linear probing, false = fine-tuning

# Feature dataset
#
# Feature cache directory structure:
#   {feat_dir}/{model_name}/{split}/{plane}/*.safetensors
# 
# Single-sequence dataset (e.g. MRNet, kneeMRI):
#   feat_dataset:
#     dataset_name: "MRNet"
#     feat_dir: "/path/to/feat_caches/MRNet/slices_raw/crop"
#     plane: ["sagittal", "coronal", "axial"]
#     model_name: ["mri-core"]
#
# Multi-sequence dataset (e.g. SKM-TEA):
#   feat_dataset:
#     dataset_name: "SKM-TEA"
#     sequences:
#       DESS_E1: "/path/to/feat_caches/SKM-TEA/DESS_E1/slices_raw/adaptive"
#       DESS_E2: "/path/to/feat_caches/SKM-TEA/DESS_E2/slices_raw/adaptive"
#     plane: ["sagittal"]
#     model_name: ["dinov2"]

feat_dataset:
  dataset_name: "MRNet"
  feat_dir: "/path/to/feat_caches/MRNet/slices_raw/crop"
  plane:
    - "sagittal"
    # - "coronal"
    # - "axial"
  model_name:
    - "mri-core"

annotations_dir: "/path/to/datasets/preprocessed/MRNet"

# Output
output_dir: "/path/to/experiments/MedSliM-linear-probing"

# Hyperparameters
hyperparams:
  batch_size: 8
  base_lr: 1e-5 # Base learning rate for linear heads (and optionally for fm_attn)
  backbone_lr_scale: 0.1 # Scale factor for COBRA backbone learning rate when fine-tuning COBRA
  weight_decay: 0.1
  warmup_ratio: 0.1  
  max_epochs: 100
  num_workers: 4
  val_split_ratio: 0.1
  patience: 10

  linear:
    hidden_dim: 512 
    dropout: 0.5
  
  # Multi-view attention aggregator hyperparameters
  attention:
    hidden_dim: 512
    dropout: 0.25
