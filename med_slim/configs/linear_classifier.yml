# Path to pretrained MedSliM checkpoint
checkpoint_path: "/hpcwork/qj474765/checkpoints/MedSliM-pretraining/test-run-MRNet/2026-01-09-04:57/medslim_test_run_MRNet-epoch2000.pth.tar"
encoder_type: "momentum"  # "base" or "momentum" encoder for downstream tasks

feat_dataset:
  dataset_name: "MRNet"
  feat_dir: "/hpcwork/rwth1833/feat_caches/MRNet/slices_32"
  plane: 
    - "sagittal"
    # - "coronal"
    # - "axial"

train_annots: "/hpcwork/rwth1833/datasets/preprocessed/MRNet/train.csv"
test_annots: "/hpcwork/rwth1833/datasets/preprocessed/MRNet/test.csv"
output_dir: "/hpcwork/rwth1833/experiments/MedSliM-linear-probing"

# Classification task settings
task: "binary" # "binary", "multiclass", "multilabel"
target_labels:
  - "meniscus" # "acl", "meniscus"

# Hyperparameters
hyperparams:
  batch_size: 16
  lr: 1e-5
  warmup_ratio: 0.1  
  max_epochs: 100
  num_workers: 4
  val_split_ratio: 0.1
  # patience: 10  # Uncomment to enable early stopping
  
  # Linear classifier hyperparameters
  linear:
    hidden_dim: 1024
    dropout: 0.3
  
  # Multi-view attention aggregator hyperparameters
  attention:
    hidden_dim: 512
    dropout: 0.1
