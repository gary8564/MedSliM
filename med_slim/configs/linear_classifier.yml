annotations_dir: "/hpcwork/rwth1833/datasets/preprocessed/SKM-TEA"
# annotations_dir: "/hpcwork/rwth1833/datasets/preprocessed/RSNA-Knee"

# ------------------------------------------------------------------------------
# Few-shot / repeated-evaluation configuration
# ------------------------------------------------------------------------------
# train_fraction: fraction of the TRAINING set used to fit the classifier head,
#   in (0, 1]. Validation and test sets are never subsampled. 
# num_repeats: number of repeated random runs for uncertainty estimation. Each
#   repeat draws a fresh seed (recorded in the outputs) and test metrics are
#   aggregated as mean +/- std.
few_shot:
  train_fraction: 1.0
  num_repeats: 1

# ------------------------------------------------------------------------------
# Output directory configuration
# ------------------------------------------------------------------------------
output_dir: "/hpcwork/qj474765/experiments/MedSliM-linear-probing/SKM-TEA"
# output_dir: "/hpcwork/rwth1833/experiments/MedSliM-linear-probing/RSNA-Knee"

# ------------------------------------------------------------------------------
# Hyperparameters
# ------------------------------------------------------------------------------
# Note: For fine-tuning, use lower learning rate and enable early stopping
hyperparams:
  batch_size: 4
  base_lr: 1e-5 # Base learning rate for linear heads
  backbone_lr_scale: 0.1 # COBRA backbone learning rate = base_lr * backbone_lr_scale when fine-tuning COBRA
  weight_decay: 0.1 #0.01  # L2 regularization to prevent overfitting
  warmup_ratio: 0.1  
  max_epochs: 100
  num_workers: 4
  val_split_ratio: 0.1
  patience: 10  # Early stopping: stop if val_auroc doesn't improve for num_patience epochs
  
  # Linear classifier hyperparameters
  linear:
    hidden_dim: 512 
    dropout: 0.5
  
  # Multi-view attention aggregator hyperparameters
  attention:
    hidden_dim: 512
    dropout: 0.25
