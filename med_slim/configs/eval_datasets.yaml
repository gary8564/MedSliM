# Shared metadata for downstream evaluation datasets.
#
# Each entry defines the task type, target CSV columns, human-readable display
# names, and (for multiclass) integer-to-class mappings.
#
# To add a new downstream evaluation dataset, create a new top-level key and fill in the fields below.

datasets:
  MRNet:
    task: binary
    target_labels: [meniscus]
    label_display_names:
      meniscus: Meniscal Tear
      acl: ACL Tear
      abnormal: Abnormal

  SKM-TEA:
    task: multilabel
    target_labels: [meniscal_tear, ligament_tear, cartilage_lesion, effusion]
    label_display_names:
      meniscal_tear: Meniscal Tear
      ligament_tear: Ligament Tear
      cartilage_lesion: Cartilage Lesion
      effusion: Effusion

  kneeMRI:
    task: multiclass
    target_labels: [acl]
    label_display_names:
      acl: ACL Tear
    multiclass_label_maps:
      acl:
        0: Normal
        1: Partial ACL Tear
        2: Complete ACL Tear
    # task: binary
    # target_labels: [acl]
    # label_display_names:
    #   acl: ACL Tear


  CT-RATE:
    task: multilabel
    target_labels:
      - Medical material
      - Arterial wall calcification
      - Cardiomegaly
      - Pericardial effusion
      - Coronary artery wall calcification
      - Hiatal hernia
      - Lymphadenopathy
      - Emphysema
      - Atelectasis
      - Lung nodule
      - Lung opacity
      - Pulmonary fibrotic sequela
      - Pleural effusion
      - Mosaic attenuation pattern
      - Peribronchial thickening
      - Consolidation
      - Bronchiectasis
      - Interlobular septal thickening
    label_display_names:
      # ... (optional; auto-formatted if omitted)

  LIDC-IDRI:
    task: binary
    target_labels: [Malignant]
    label_display_names:
      Malignant: Malignant Nodule
    # task: multiclass
    # target_labels: [malignancy]
    # label_display_names:
    #   malignancy: Malignancy
    # multiclass_label_maps:
    #   malignancy:
    #     0: Highly Unlikely
    #     1: Moderately Unlikely
    #     2: Moderately Suspicious
    #     3: Highly Suspicious